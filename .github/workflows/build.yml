# Builds the desktop app for Windows and macOS and publishes it as a GitHub Release, so it
# can be downloaded from the repo's Releases page. macOS apps can only be built on a Mac,
# so each is built on its own machine.
#
# It runs by itself whenever a push to main changes the app (not just the docs), and every
# run is a new release with a version of its own: package.json's major and minor version and
# the run's number (v0.1.57, then v0.1.58...). Its notes say what's new since the last
# release, from the patch notes (scripts/release-notes.mjs). Pushing a tag like v0.2.0, or
# "Run workflow" in the Actions tab, also works.
name: Build desktop apps

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - '**.md'
      - 'docs/**'

# One at a time, in order: a push made while another is building waits its turn, so each
# gets its own release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - name: Pick the version
        id: version
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            base=$(node -p "require('./package.json').version.split('.').slice(0, 2).join('.')")
            echo "version=$base.$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
            artifact: My-Pet-Windows
            files: |
              release/*.exe
          - os: macos-latest
            script: dist:mac
            artifact: My-Pet-macOS
            files: |
              release/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # The app says this version (in its installer, and in About on a Mac).
      - run: npm version ${{ needs.version.outputs.version }} --no-git-tag-version --allow-same-version

      - run: npm test

      # No signing certificate: Windows builds go out unsigned, and macOS builds are
      # signed ad hoc only (they open after right-click > Open the first time).
      - run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: v${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Reads the patch notes (TypeScript) as they are.
      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Tag this commit
        if: github.ref_type != 'tag'
        shell: bash
        run: |
          # (A push made with the workflow's own token doesn't start another run.)
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"

      # What's new since the last release: the patch notes it didn't have.
      - name: Write the notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>/dev/null || true)
          if [ -n "$last" ] && [ "$last" != "$TAG" ] && git show "$last:src/lib/patchNotes.ts" > "$RUNNER_TEMP/last-patchNotes.ts" 2>/dev/null; then
            node scripts/release-notes.mjs "$GITHUB_SHA" "$RUNNER_TEMP/last-patchNotes.ts" > "$RUNNER_TEMP/notes.md"
          else
            node scripts/release-notes.mjs "$GITHUB_SHA" > "$RUNNER_TEMP/notes.md"
          fi
          cat "$RUNNER_TEMP/notes.md"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: My Pet ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          overwrite_files: true
          files: out/*
          body_path: ${{ runner.temp }}/notes.md
