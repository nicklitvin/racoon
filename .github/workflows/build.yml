# Builds the desktop app for Windows and macOS and publishes it as a GitHub Release, so it
# can be downloaded from the repo's Releases page. macOS apps can only be built on a Mac,
# so each is built on its own machine.
#
# It runs by itself whenever a push to main changes the app (not just the docs), and keeps
# one release per version in package.json (v0.1.0): each run moves that tag to the new
# commit and replaces the downloads. Bump the version for a new release. Pushing a tag like
# v0.2.0, or "Run workflow" in the Actions tab, also works.
name: Build desktop apps

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - '**.md'
      - 'docs/**'

# Pushes in quick succession only build the newest.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
            artifact: My-Pet-Windows
            files: |
              release/*.exe
          - os: macos-latest
            script: dist:mac
            artifact: My-Pet-macOS
            files: |
              release/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm test

      # No signing certificate: Windows builds go out unsigned, and macOS builds are
      # signed ad hoc only (they open after right-click > Open the first time).
      - run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Name the release
        id: name
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            tag="v$(node -p "require('./package.json').version")"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            # Point the version's tag at this commit. (A push made with the workflow's own
            # token doesn't start another run.)
            git tag -f "$tag" "$GITHUB_SHA"
            git push -f origin "refs/tags/$tag"
          fi

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.name.outputs.tag }}
          name: My Pet ${{ steps.name.outputs.tag }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          overwrite_files: true
          files: out/*
          body: |
            Built from ${{ github.sha }}.

            ## Download

            **Windows**
            - `My-Pet-Setup-*.exe`: installs My Pet (no admin rights needed).
            - `My-Pet-Portable-*.exe`: runs without installing.

            The app isn't code-signed, so Windows may say "Windows protected your PC": click **More info → Run anyway**.

            **macOS**
            - `My-Pet-*-mac-arm64.dmg`: Apple silicon (M1 and later).
            - `My-Pet-*-mac-x64.dmg`: Intel Macs.

            Open the `.dmg` and drag My Pet to Applications. It isn't notarized by Apple, so macOS blocks it at first (it may even say it's "damaged"). To let it run, open Terminal and run `xattr -cr "/Applications/My Pet.app"`, or try to open it once, then go to **System Settings → Privacy & Security** and click **Open Anyway**.
